name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Security scan - Bandit (SAST)
        run: bandit -c pyproject.toml -r bot_common message_router_function_url.py nlp_processor.py

      - name: Security scan - pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt

      - name: Validate CloudFormation template
        run: |
          pip install cfn-lint
          cfn-lint infrastructure/bot-stack.yaml
